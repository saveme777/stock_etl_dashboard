<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биржевой ETL Дашборд</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        p {
            color: #666;
        }
        /* Стили для таблицы, которую сгенерировал Pandas */
        .stock-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .stock-table th, .stock-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        .stock-table th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }
        .stock-table tr:hover {
            background-color: #f1f6fa;
        }
    </style>
</head>
<body>

    <h1>📈 Мой биржевой ETL-пайплайн</h1>
    <p>Данные по акциям Apple, обработанные с помощью Python и выведенные через кастомный HTML/CSS интерфейс.</p>

    <h2>Последние котировки и метрики</h2>
    
    <!-- Сюда подставляется таблица из Python -->
    <div>
        {{ table | safe }}
    </div>

</body>
</html>
